syntax = "proto3";

package booking;
option go_package = "github.com/omnibus-ea/booking-service/proto";

service BookingService {
  rpc GetBookingByPNR(GetBookingRequest) returns (GetBookingResponse);
  rpc LockSeat(LockSeatRequest) returns (LockSeatResponse);
}

message GetBookingRequest {
  string pnr = 1;
}

message GetBookingResponse {
  string pnr = 1;
  string status = 2;
  string seat = 3;
  string passenger = 4;
  double amount = 5;
}

message LockSeatRequest {
  string schedule_id = 1;
  string seat_number = 2;
  string user_id = 3;
}

message LockSeatResponse {
  string pnr = 1;
  string status = 2;
  int32 expires_in = 3;
  string lock_id = 4;
}
