apiVersion: v1
kind: ConfigMap
metadata:
  name: omnibus-config
  namespace: omnibus
data:
  DB_HOST: "omnibus-db.cluster-xxx.af-south-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "omnibus"
  REDIS_HOST: "omnibus-redis.xxx.cache.amazonaws.com"
  REDIS_PORT: "6379"
  KAFKA_BROKERS: "omnibus-kafka.xxx.kafka.af-south-1.amazonaws.com:9092"
  AWS_REGION: "af-south-1"
  WEBAUTHN_RP_ID: "admin.omnibus.ea"
  WEBAUTHN_ORIGIN: "https://admin.omnibus.ea"
