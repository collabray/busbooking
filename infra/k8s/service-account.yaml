apiVersion: v1
kind: ServiceAccount
metadata:
  name: omnibus-sa
  namespace: omnibus
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/omnibus-service-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: omnibus-role
  namespace: omnibus
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omnibus-rolebinding
  namespace: omnibus
subjects:
- kind: ServiceAccount
  name: omnibus-sa
  namespace: omnibus
roleRef:
  kind: Role
  name: omnibus-role
  apiGroup: rbac.authorization.k8s.io
