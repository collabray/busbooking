version: '3.8'

services:
  # Databases
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omnibus
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: omnibus
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnibus"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Microservices
  auth-service:
    build: ../../services/auth-service
    ports:
      - "8081:8080"
      - "9091:9090"
    environment:
      HTTP_PORT: 8080
      GRPC_PORT: 9090
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: omnibus
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: omnibus
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      KMS_KEY_ID: ${KMS_KEY_ID}
      AWS_REGION: af-south-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  booking-service:
    build: ../../services/booking-service
    ports:
      - "8082:8080"
      - "9092:9090"
    environment:
      HTTP_PORT: 8080
      GRPC_PORT: 9090
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: omnibus
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: omnibus
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOCK_TTL_SECONDS: 300
    depends_on:
      - auth-service

  inventory-service:
    build: ../../services/inventory-service
    ports:
      - "8083:8080"
    environment:
      DATABASE_URL: postgres://omnibus:${DB_PASSWORD}@postgres:5432/omnibus
      REDIS_URL: redis://redis:6379
      OPENSEARCH_URL: http://opensearch:9200
    depends_on:
      - postgres
      - redis

  payment-service:
    build: ../../services/payment-service
    ports:
      - "8084:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: omnibus
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: omnibus_payments
      KAFKA_BROKERS: kafka:9092
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE}
      MPESA_PASSKEY: ${MPESA_PASSKEY}
    depends_on:
      - kafka
      - postgres

  ticket-service:
    build: ../../services/ticket-service
    ports:
      - "8085:8080"
    environment:
      DATABASE_URL: postgres://omnibus:${DB_PASSWORD}@postgres:5432/omnibus
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres

  notification-service:
    build: ../../services/notification-service
    ports:
      - "8086:8000"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AT_USERNAME: ${AT_USERNAME}
      AT_API_KEY: ${AT_API_KEY}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
    depends_on:
      - redis

  wallet-service:
    build: ../../services/wallet-service
    ports:
      - "8087:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: omnibus
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: omnibus
    depends_on:
      - postgres

  cargo-service:
    build: ../../services/cargo-service
    ports:
      - "8088:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: omnibus
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: omnibus
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  admin-service:
    build: ../../services/admin-service
    ports:
      - "8089:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: omnibus
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: omnibus
      KAFKA_BROKERS: kafka:9092
    depends_on:
      - postgres
      - kafka

  # API Gateway
  kong:
    image: kong:3.5
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./kong-config:/kong/declarative

  # OpenSearch
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
